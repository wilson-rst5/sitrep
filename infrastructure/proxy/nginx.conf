limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=geocoding:10m rate=20r/m;
server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8000;
    location ~ ^/api/v1/(login|setup)$ {
        limit_req zone=signin burst=10 nodelay;
        proxy_pass http://$api;
    }
    location ~ ^/api/v1/locations/(reverse-geocode|search)$ {
        limit_req zone=geocoding burst=5 nodelay;
        proxy_pass http://$api;
    }
    location ^~ /api/v1/traffic/tiles/ {
        limit_req zone=api_rate burst=70 nodelay;
        proxy_pass http://$api;
    }
    location = /api/v1/stream {
        limit_req zone=api_rate burst=10 nodelay;
        proxy_buffering off;
        proxy_read_timeout 25s;
        proxy_pass http://$api;
    }
    location /api/ {
        limit_req zone=api_rate burst=30 nodelay;
        proxy_buffering off;
        proxy_pass http://$api;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
