name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/core/requirements.txt pytest ruff pip-audit
      - run: ruff check services/core tests/unit
      - run: PYTHONPATH=services/core pytest tests/unit
      - run: pip-audit -r services/core/requirements.txt
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/web install --no-audit
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm --prefix apps/web run build
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: scripts/init-env.sh
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 180
        env:
          ENABLED_PROVIDERS: ''
      - name: Publish isolated test fixtures through JetStream
        run: docker compose exec -T collector python - < tests/integration/publish_fixture.py
      - name: Verify authenticated dashboard and mobile layout
        run: |
          set -a
          . ./.env
          set +a
          SITREP_TEST_SETUP_TOKEN="$SETUP_TOKEN" npx playwright test
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
      - name: Scan Git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git --redact /repo
