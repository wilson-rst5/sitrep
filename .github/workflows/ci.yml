name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git --redact --log-opts=--all /repo
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/core/requirements.txt pytest ruff pip-audit
      - run: ruff check --select E4,E7,E9,F services/core tests/unit
      - run: PYTHONPATH=services/core pytest tests/unit
      - run: pip-audit -r services/core/requirements.txt
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci --no-audit
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm --prefix apps/web run build
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: scripts/init-env.sh
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 180
        env:
          ENABLED_PROVIDERS: ''
      - name: Publish isolated test fixtures through JetStream
        run: docker compose exec -T collector python - < tests/integration/publish_fixture.py
      - name: Verify authenticated dashboard and mobile layout
        run: |
          set -a
          . ./.env
          set +a
          SITREP_TEST_SETUP_TOKEN="$SETUP_TOKEN" npx playwright test
      - if: failure() && hashFiles('.env') != ''
        run: docker compose logs --no-color
      - if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes
